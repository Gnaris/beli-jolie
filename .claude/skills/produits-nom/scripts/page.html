<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beli & Jolie — Renommer les produits</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4;
      color: #1c1917;
      line-height: 1.5;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: white;
      border-bottom: 1px solid #e7e5e4;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .progress-wrap { flex: 1; max-width: 480px; }
    .progress-label { font-size: 13px; color: #57534e; margin-bottom: 4px; }
    .progress-bar { height: 8px; background: #e7e5e4; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #16a34a; transition: width .3s; }
    .push-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .push-btn.ready {
      background: #16a34a;
      color: white;
    }
    .push-btn.disabled {
      background: #e7e5e4;
      color: #a8a29e;
      cursor: not-allowed;
    }
    .push-btn.pushed {
      background: #0369a1;
      color: white;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }
    .product-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    .image-section {
      background: #fafaf9;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #e7e5e4;
    }
    .product-image {
      width: 100%;
      max-width: 1520px;
      aspect-ratio: 1;
      object-fit: contain;
      background: white;
      border-radius: 12px;
      border: 1px solid #e7e5e4;
      cursor: zoom-in;
      transition: transform .15s;
    }
    .product-image:hover { transform: scale(1.02); }
    #img-lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center; justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
    }
    #img-lightbox.open { display: flex; }
    #img-lightbox img {
      max-width: 92vw; max-height: 92vh;
      object-fit: contain;
      background: white;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    #img-lightbox .close-hint {
      position: absolute; top: 20px; right: 24px;
      color: white; font-size: 14px; opacity: .8;
      pointer-events: none;
    }
    .ref-line {
      font-size: 13px;
      color: #57534e;
      text-align: center;
    }
    .ref-line strong { color: #1c1917; font-size: 16px; }
    .current-meta {
      width: 100%;
      max-width: 1520px;
      background: #fafaf9;
      border: 1px dashed #d6d3d1;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #57534e;
    }
    .current-meta-label { font-weight: 600; color: #44403c; }
    .choices-section {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: #57534e;
      margin-bottom: 8px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: all .15s;
    }
    .option:hover { background: #fafaf9; }
    .option.selected {
      background: #ecfdf5;
      border-color: #16a34a;
    }
    .option input[type="radio"] {
      margin-top: 2px;
      accent-color: #16a34a;
      cursor: pointer;
    }
    .option-text { flex: 1; font-size: 14px; }
    .option.none-option {
      border-color: #fde68a;
      background: #fffbeb;
    }
    .option.none-option.selected {
      background: #fef3c7;
      border-color: #d97706;
    }
    .comment-area {
      margin-top: 10px;
      padding: 12px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
    }
    .comment-area label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #92400e;
      margin-bottom: 6px;
    }
    .comment-area textarea {
      width: 100%;
      min-height: 60px;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid #e7e5e4;
      margin-top: 4px;
    }
    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      flex: 1;
    }
    .btn-primary {
      background: #16a34a;
      color: white;
    }
    .btn-primary:disabled {
      background: #d6d3d1;
      cursor: not-allowed;
    }
    .btn-regen {
      background: #d97706;
      color: white;
    }
    .btn-secondary {
      background: white;
      border: 1px solid #d6d3d1;
      color: #44403c;
    }
    .btn-secondary:disabled {
      color: #a8a29e;
      cursor: not-allowed;
    }
    .navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }
    .nav-btn {
      background: white;
      border: 1px solid #d6d3d1;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .nav-btn:disabled { color: #a8a29e; cursor: not-allowed; }
    .nav-position {
      font-size: 14px;
      color: #57534e;
      font-weight: 500;
    }
    .empty {
      text-align: center;
      padding: 80px 24px;
      color: #57534e;
    }
    .empty h2 { font-size: 24px; margin-bottom: 12px; color: #1c1917; }
    .empty p { font-size: 15px; margin-bottom: 24px; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal {
      background: white;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      text-align: center;
    }
    .modal h2 { font-size: 22px; margin-bottom: 12px; }
    .modal p { margin-bottom: 16px; color: #44403c; }
    .modal .ref-badge {
      display: inline-block;
      background: #f5f5f4;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 600;
      margin: 0 4px;
    }
    .modal .comment-box {
      background: #fafaf9;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      text-align: left;
      font-size: 13px;
      color: #57534e;
    }
    .pulse {
      width: 12px;
      height: 12px;
      background: #d97706;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .saved-indicator {
      font-size: 12px;
      color: #16a34a;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1917;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 200;
      opacity: 0;
      transition: opacity .3s;
    }
    .toast.show { opacity: 1; }

    /* RECAP VIEW */
    .recap-header {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 16px;
      text-align: center;
    }
    .recap-header.pushed { background: #ecfdf5; border: 1px solid #16a34a; }
    .recap-header h1 { font-size: 22px; margin-bottom: 8px; }
    .recap-header.pushed h1 { color: #15803d; }
    .recap-header p { color: #57534e; }
    .recap-stat { font-size: 36px; font-weight: 700; color: #16a34a; margin: 8px 0; }
    .recap-list {
      background: white;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .recap-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid #f5f5f4;
      align-items: center;
    }
    .recap-row:last-child { border-bottom: none; }
    .recap-thumb {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: #fafaf9;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
    }
    .recap-thumb-empty {
      width: 70px;
      height: 70px;
      background: #fafaf9;
      border-radius: 8px;
      border: 1px dashed #d6d3d1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a8a29e;
      font-size: 11px;
    }
    .recap-info { min-width: 0; }
    .recap-ref {
      font-size: 12px;
      font-weight: 700;
      color: #78716c;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
    }
    .recap-name { font-size: 15px; font-weight: 600; color: #1c1917; }
    .recap-desc { font-size: 13px; color: #57534e; margin-top: 2px; font-style: italic; }
    .recap-skip {
      display: inline-block;
      padding: 2px 8px;
      background: #f5f5f4;
      color: #78716c;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .recap-edit {
      background: white;
      border: 1px solid #d6d3d1;
      color: #44403c;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .recap-edit:hover { background: #fafaf9; }
    .recap-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .recap-actions .btn {
      flex: 0 1 auto;
      min-width: 200px;
      padding: 14px 24px;
    }
    .btn-back {
      background: white;
      border: 1px solid #d6d3d1;
      color: #44403c;
    }
    .btn-big-push {
      background: #16a34a;
      color: white;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(22,163,74,.3);
    }
    .btn-big-push:hover { background: #15803d; }
    .btn-big-push:disabled { background: #d6d3d1; cursor: not-allowed; box-shadow: none; }

    /* HINTS VIEW — étape 1 : la cliente décrit chaque produit */
    .hints-intro {
      background: white;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 24px 28px;
      margin-bottom: 16px;
    }
    .hints-intro h1 { font-size: 20px; margin-bottom: 8px; color: #1c1917; }
    .hints-intro p { color: #57534e; font-size: 14px; line-height: 1.55; }
    .hints-intro .hint-example {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #fafaf9;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      font-size: 13px;
      color: #44403c;
      font-style: italic;
    }
    .hints-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }
    .hint-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      transition: border-color .15s, background .15s;
      border: 1px solid transparent;
    }
    .hint-card.filled { border-color: #86efac; background: #f7fef9; }
    .hint-card-image {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 1;
      height: auto;
      justify-self: center;
      object-fit: contain;
      background: #fafaf9;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
      cursor: zoom-in;
    }
    .hint-card-body { display: flex; flex-direction: column; min-width: 0; }
    .hint-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 8px;
    }
    .hint-card-ref {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: #1c1917;
    }
    .hint-card-cat { font-size: 12px; color: #78716c; }
    .hint-card-oldname {
      font-size: 12px;
      color: #a8a29e;
      font-style: italic;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint-textarea {
      width: 100%;
      flex: 1;
      min-height: 80px;
      border: 1px solid #d6d3d1;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      background: white;
    }
    .hint-textarea:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,.15);
    }
    .hint-status {
      font-size: 11px;
      color: #78716c;
      margin-top: 4px;
      min-height: 14px;
    }
    .hint-status.saved { color: #16a34a; font-weight: 500; }
    .hint-status.error { color: #dc2626; font-weight: 500; }
    .hints-cta {
      position: sticky;
      bottom: 16px;
      display: flex;
      justify-content: center;
      margin-top: 16px;
      z-index: 5;
    }
    .btn-generate {
      background: #16a34a;
      color: white;
      padding: 16px 28px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22,163,74,.35);
      transition: all .15s;
    }
    .btn-generate:hover { background: #15803d; transform: translateY(-1px); }
    .btn-generate:disabled {
      background: #d6d3d1;
      color: #78716c;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    @media (max-width: 900px) {
      .hint-card-image { max-width: 100%; }
    }

    /* AWAITING GENERATION — étape 1.5 : modale d'attente pendant que Claude analyse */
    .await-gen-view {
      background: white;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      padding: 48px 32px;
      text-align: center;
      margin-top: 40px;
    }
    .await-gen-view h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #1c1917;
    }
    .await-gen-view p {
      color: #44403c;
      font-size: 15px;
      margin-bottom: 16px;
      line-height: 1.55;
    }
    .await-gen-view .cmd-hint {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      background: #1c1917;
      color: white;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progress-text">Chargement…</span>
        <span id="saved-info" class="saved-indicator" style="float:right; display:none;">✓ Sauvegardé</span>
      </div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
    </div>
    <button id="push-btn" class="push-btn disabled" disabled>Tout pousser sur le site</button>
  </div>

  <div class="container">
    <div id="main"></div>
  </div>

  <div id="toast" class="toast"></div>

  <div id="img-lightbox" onclick="closeLightbox()">
    <div class="close-hint">✕ cliquer n'importe où pour fermer (ou Échap)</div>
    <img id="img-lightbox-img" src="" alt="">
  </div>

  <script>
    let session = null;
    let currentIdx = 0;
    let selectedName = null;
    let selectedDesc = null;
    let nameComment = '';
    let descComment = '';
    let viewMode = 'edit'; // 'edit' | 'recap'
    let autoRecapShown = false; // basculement auto en recap déjà fait une fois ?

    // Sous-catégories et tags pour le produit courant
    let subcats = new Map();
    let tags = new Map();
    let composition = new Map(); // { [ref]: { ref, category, checked } }
    let currentProduct = null;

    async function fetchSession() {
      const r = await fetch('/api/session');
      if (!r.ok) return null;
      return await r.json();
    }

    async function postJSON(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return r.ok;
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function showSaved() {
      const el = document.getElementById('saved-info');
      el.style.display = 'inline-flex';
      el.textContent = '✓ Sauvegardé';
      setTimeout(() => { el.style.display = 'none'; }, 1800);
    }

    function findFirstUnvalidatedIdx() {
      if (!session) return 0;
      const products = session.products || [];
      const decisions = session.decisions || {};
      for (let i = 0; i < products.length; i++) {
        if (!decisions[products[i].reference]) return i;
      }
      return Math.max(0, products.length - 1);
    }

    function countValidated() {
      if (!session) return 0;
      return Object.keys(session.decisions || {}).length;
    }

    function render() {
      if (!session) {
        document.getElementById('main').innerHTML = '<div class="empty"><h2>Chargement…</h2></div>';
        return;
      }

      const products = session.products || [];
      const totalCount = products.length;
      const phase = session.phase || 'validating'; // backward compat sessions v1/v2

      // Routage par phase : indices → grille, en attente de génération → modale,
      // validating → comportement historique (édition + récap + push).
      if (phase === 'collecting_hints') {
        renderHintsView();
        return;
      }
      if (phase === 'awaiting_generation') {
        renderAwaitingGenerationView();
        return;
      }

      const validatedCount = countValidated();

      // Topbar
      document.getElementById('progress-text').textContent =
        `${validatedCount} sur ${totalCount} produit(s) traité(s)`;
      document.getElementById('progress-fill').style.width =
        totalCount > 0 ? `${(validatedCount / totalCount) * 100}%` : '0%';

      const pushBtn = document.getElementById('push-btn');
      pushBtn.style.display = '';
      if (session.status === 'pushed') {
        pushBtn.className = 'push-btn pushed';
        pushBtn.disabled = true;
        pushBtn.textContent = '✓ Envoyé sur le site';
      } else if (validatedCount > 0) {
        pushBtn.className = 'push-btn ready';
        pushBtn.disabled = false;
        pushBtn.textContent = `Tout pousser sur le site (${validatedCount})`;
      } else {
        pushBtn.className = 'push-btn disabled';
        pushBtn.disabled = true;
        pushBtn.textContent = 'Tout pousser sur le site';
      }

      // Awaiting regen overlay?
      const existingOverlay = document.querySelector('.overlay');
      if (session.awaitingRegen) {
        if (!existingOverlay) {
          const what = session.awaitingRegen.what === 'name' ? 'noms'
            : session.awaitingRegen.what === 'description' ? 'descriptions'
            : 'noms et descriptions';
          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = `
            <div class="modal">
              <h2><span class="pulse"></span>Regénération en cours</h2>
              <p>
                Vous avez demandé de regénérer les <strong>${what}</strong>
                pour le produit <span class="ref-badge">${session.awaitingRegen.ref}</span>.
              </p>
              <div class="comment-box">
                <strong>Votre commentaire :</strong><br>
                ${escapeHtml(session.awaitingRegen.comment || '(aucun)')}
              </div>
              <p style="font-weight:600; color:#d97706;">
                Revenez dans Claude Code et tapez simplement :<br>
                <code style="background:#fafaf9; padding:4px 8px; border-radius:4px; font-size:15px;">regénère</code>
              </p>
              <p style="font-size:12px; color:#78716c; margin-top:16px;">
                Cette page se mettra à jour automatiquement dès que les nouvelles propositions seront prêtes.
              </p>
            </div>
          `;
          document.body.appendChild(overlay);
        }
        return;
      } else {
        if (existingOverlay) existingOverlay.remove();
      }

      // Empty?
      if (totalCount === 0) {
        document.getElementById('main').innerHTML = `
          <div class="empty">
            <h2>Aucun produit dans la session</h2>
            <p>Retournez dans Claude Code pour créer une session.</p>
          </div>`;
        return;
      }

      // Recap view: shown after push, after explicit toggle, or auto-once when all validated
      const allValidated = products.every(p => (session.decisions || {})[p.reference]);
      if (session.status === 'pushed') {
        viewMode = 'recap';
        renderRecap();
        return;
      }
      if (viewMode === 'recap') {
        renderRecap();
        return;
      }
      if (allValidated && !autoRecapShown) {
        autoRecapShown = true;
        viewMode = 'recap';
        renderRecap();
        return;
      }

      const p = products[currentIdx];
      if (!p) { currentIdx = 0; render(); return; }

      const existingDecision = (session.decisions || {})[p.reference];
      if (selectedName === null && existingDecision) selectedName = existingDecision.name;
      if (selectedDesc === null && existingDecision) selectedDesc = existingDecision.description;

      const imgSrc = `/images/${p.reference.toLowerCase()}.webp`;
      const namesHtml = (p.names || []).map((n, i) => `
        <label class="option ${selectedName === n ? 'selected' : ''}">
          <input type="radio" name="name" value="${escapeAttr(n)}" ${selectedName === n ? 'checked' : ''} onchange="onSelectName(this.value)">
          <span class="option-text">${escapeHtml(n)}</span>
        </label>
      `).join('');

      const descsHtml = (p.descs || []).map((d, i) => `
        <label class="option ${selectedDesc === d ? 'selected' : ''}">
          <input type="radio" name="desc" value="${escapeAttr(d)}" ${selectedDesc === d ? 'checked' : ''} onchange="onSelectDesc(this.value)">
          <span class="option-text">${escapeHtml(d)}</span>
        </label>
      `).join('');

      const isNoneName = selectedName === '__NONE__';
      const isNoneDesc = selectedDesc === '__NONE__';

      // Initialise subcats/tags pour ce produit (reset à chaque changement de produit)
      initSubcatTagsForProduct(p);

      // Bannière clarification
      const clarifQuestions = p.clarifyingQuestions || [];
      const clarifQuestionsHtml = clarifQuestions.map(q =>
        '<div style="margin-bottom:8px;">' +
        '<p style="font-size:13px;color:#92400e;">• ' + escapeHtml(q) + '</p>' +
        '<input type="text" style="margin-top:4px;width:100%;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;font-size:13px;" class="clarif-answer" data-question="' + encodeURIComponent(q) + '" />' +
        '</div>'
      ).join('');
      const clarifCategoryFlagHtml = p.categoryFlag
        ? '<p style="margin-top:12px;font-size:13px;color:#92400e;">⚠ La catégorie actuelle « ' + escapeHtml(p.categoryFlag.current) + ' » me semble fausse — cela ressemble à : ' + escapeHtml(p.categoryFlag.suggested) + '. À corriger manuellement dans l\'admin si vous êtes d\'accord.</p>'
        : '';
      const showBanner = clarifQuestions.length > 0 || !!p.categoryFlag;

      // Label sous-catégorie
      const subcatCatLabel = p.category ? '(sous « ' + escapeHtml(typeof p.category === 'string' ? p.category : p.category.name) + ' »)' : '';

      document.getElementById('main').innerHTML = `
        ${showBanner ? `
        <aside style="border-radius:12px;border:1px solid #fcd34d;background:#fffbeb;padding:16px;margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:18px;">⚠️</span>
            <h3 style="font-size:13px;font-weight:700;color:#92400e;">J'ai besoin de précisions (optionnel)</h3>
          </div>
          <div id="clarif-questions">${clarifQuestionsHtml}</div>
          ${clarifCategoryFlagHtml}
          <button id="clarif-regen-btn" type="button" style="margin-top:12px;border-radius:8px;background:#d97706;padding:8px 14px;font-size:13px;font-weight:600;color:white;border:none;cursor:pointer;">
            Regénérer avec mes réponses
          </button>
        </aside>` : ''}

        <div class="product-card">
          <div class="image-section">
            <img class="product-image" src="${imgSrc}" alt="${p.reference}" title="Cliquer pour zoomer" onclick="openLightbox('${imgSrc}')" onerror="this.style.display='none'">
            <div class="ref-line">
              Référence : <strong>${p.reference}</strong>
              ${p.category ? `<br><small>${escapeHtml(typeof p.category === 'string' ? p.category : p.category.name)}</small>` : ''}
            </div>
            ${p.name || p.description ? `
              <div class="current-meta">
                <div class="current-meta-label">Texte actuel sur le site :</div>
                ${p.name ? `<div style="margin-top:4px;"><strong>${escapeHtml(p.name)}</strong></div>` : ''}
                ${p.description ? `<div style="margin-top:4px; font-style:italic;">${escapeHtml(p.description)}</div>` : ''}
              </div>` : ''}
          </div>

          <div class="choices-section">
            <div>
              <div class="section-title">Choisissez un nom</div>
              ${namesHtml}
              <label class="option none-option ${isNoneName ? 'selected' : ''}">
                <input type="radio" name="name" value="__NONE__" ${isNoneName ? 'checked' : ''} onchange="onSelectName(this.value)">
                <span class="option-text">⚠ Aucun ne va — me redemander</span>
              </label>
              ${isNoneName ? `
                <div class="comment-area">
                  <label for="name-comment">Pourquoi aucun nom ne va ?</label>
                  <textarea id="name-comment" placeholder="Ex : il n'y a pas de cœur sur ce produit, c'est une croix" oninput="nameComment = this.value">${escapeHtml(nameComment)}</textarea>
                </div>` : ''}
            </div>

            <div>
              <div class="section-title">Choisissez une description</div>
              ${descsHtml}
              <label class="option none-option ${isNoneDesc ? 'selected' : ''}">
                <input type="radio" name="desc" value="__NONE__" ${isNoneDesc ? 'checked' : ''} onchange="onSelectDesc(this.value)">
                <span class="option-text">⚠ Aucune ne va — me redemander</span>
              </label>
              ${isNoneDesc ? `
                <div class="comment-area">
                  <label for="desc-comment">Pourquoi aucune description ne va ?</label>
                  <textarea id="desc-comment" placeholder="Ex : il n'y a pas de strass, mais des perles" oninput="descComment = this.value">${escapeHtml(descComment)}</textarea>
                </div>` : ''}
            </div>

            <!-- Contenu de l'ensemble (parures uniquement) -->
            ${(p.siblings && p.siblings.length > 0) ? `
            <section style="margin-top:8px;">
              <div class="section-title">Contenu de l'ensemble</div>
              <div style="font-size:12px;color:#78716c;margin-bottom:8px;">Cochez les produits qui font partie de cette parure — tout est coché par défaut.</div>
              <div id="composition-list" style="display:flex;flex-direction:column;gap:6px;"></div>
            </section>` : ''}

            <!-- Sous-catégories -->
            <section style="margin-top:8px;">
              <div class="section-title">
                Sous-catégories <span id="subcats-cat-label" style="font-weight:400;text-transform:none;letter-spacing:normal;color:#a8a29e;">${subcatCatLabel}</span>
              </div>
              <div id="subcats-list" style="display:flex;flex-wrap:wrap;gap:8px;min-height:24px;"></div>
              <div style="margin-top:10px;display:flex;align-items:center;gap:8px;position:relative;">
                <input
                  type="text"
                  id="subcat-add-input"
                  placeholder="+ autre sous-catégorie"
                  style="flex:1;border:1px solid #e7e5e4;border-radius:8px;background:white;padding:8px 12px;font-size:13px;"
                  autocomplete="off"
                />
                <button id="subcat-add-btn" type="button" style="border-radius:8px;background:#44403c;padding:8px 14px;font-size:13px;color:white;border:none;cursor:pointer;">Ajouter</button>
                <ul id="subcat-suggestions" style="display:none;position:absolute;top:100%;left:0;right:80px;z-index:10;margin-top:4px;border-radius:8px;border:1px solid #e7e5e4;background:white;box-shadow:0 4px 12px rgba(0,0,0,.1);max-height:192px;overflow-y:auto;padding:0;"></ul>
              </div>
            </section>

            <!-- Tags -->
            <section style="margin-top:8px;">
              <div class="section-title">Tags</div>
              <div id="tags-list" style="display:flex;flex-wrap:wrap;gap:8px;min-height:24px;"></div>
              <div style="margin-top:10px;display:flex;align-items:center;gap:8px;position:relative;">
                <input
                  type="text"
                  id="tag-add-input"
                  placeholder="+ autre tag"
                  style="flex:1;border:1px solid #e7e5e4;border-radius:8px;background:white;padding:8px 12px;font-size:13px;"
                  autocomplete="off"
                />
                <button id="tag-add-btn" type="button" style="border-radius:8px;background:#44403c;padding:8px 14px;font-size:13px;color:white;border:none;cursor:pointer;">Ajouter</button>
                <ul id="tag-suggestions" style="display:none;position:absolute;top:100%;left:0;right:80px;z-index:10;margin-top:4px;border-radius:8px;border:1px solid #e7e5e4;background:white;box-shadow:0 4px 12px rgba(0,0,0,.1);max-height:192px;overflow-y:auto;padding:0;"></ul>
              </div>
            </section>

            <div class="actions">
              ${(isNoneName || isNoneDesc) ? `
                <button class="btn btn-regen" onclick="requestRegen()">
                  Demander de regénérer
                </button>` : `
                <button class="btn btn-primary" onclick="validate()" ${(!selectedName || !selectedDesc) ? 'disabled' : ''}>
                  ${existingDecision ? 'Mettre à jour' : 'Valider'} et passer au suivant
                </button>`}
              <button class="btn btn-secondary" onclick="keepAsIs()" title="Marque le produit comme « traité par l'IA » sans changer le nom, la description, les tags ni les sous-catégories.">✓ Pas besoin de modifier</button>
              <button class="btn btn-secondary" onclick="skip()">Passer (sans choisir)</button>
            </div>

            <div class="navigation">
              <button class="nav-btn" onclick="goPrev()" ${currentIdx === 0 ? 'disabled' : ''}>← Précédent</button>
              <span class="nav-position">Produit ${currentIdx + 1} / ${totalCount}</span>
              <button class="nav-btn" onclick="goNext()" ${currentIdx === totalCount - 1 ? 'disabled' : ''}>Suivant →</button>
            </div>
          </div>
        </div>
      `;

      // Post-render: wire up subcats/tags chips + autocomplete + clarif button
      renderSubcats();
      renderTags();
      renderComposition();
      setupSubcatTagListeners();
    }

    function renderRecap() {
      const products = session.products || [];
      const decisions = session.decisions || {};
      const validatedCount = Object.keys(decisions).length;
      const isPushed = session.status === 'pushed';

      const rowsHtml = products.map((p, idx) => {
        const d = decisions[p.reference];
        const imgSrc = `/images/${p.reference.toLowerCase()}.webp`;
        const right = isPushed
          ? '<span class="recap-skip" style="background:#dcfce7; color:#15803d;">✓ Envoyé</span>'
          : `<button class="recap-edit" onclick="editFromRecap(${idx})">Modifier</button>`;
        if (!d) {
          return `
            <div class="recap-row">
              <img class="recap-thumb" src="${imgSrc}" alt="" onerror="this.outerHTML='<div class=&quot;recap-thumb-empty&quot;>—</div>'">
              <div class="recap-info">
                <div class="recap-ref">${p.reference}</div>
                <div class="recap-name" style="color:#a8a29e; font-style:italic;">— passé sans choix —</div>
              </div>
              ${right}
            </div>`;
        }
        return `
          <div class="recap-row">
            <img class="recap-thumb" src="${imgSrc}" alt="" onerror="this.outerHTML='<div class=&quot;recap-thumb-empty&quot;>—</div>'">
            <div class="recap-info">
              <div class="recap-ref">${p.reference}</div>
              <div class="recap-name">${escapeHtml(d.name)}</div>
              <div class="recap-desc">${escapeHtml(d.description)}</div>
            </div>
            ${right}
          </div>`;
      }).join('');

      const headerHtml = isPushed ? `
        <div class="recap-header pushed">
          <h1>✓ Tout est parti sur le site !</h1>
          <div class="recap-stat">${session.pushed_count || validatedCount}</div>
          <p>produit(s) envoyés à votre boutique, à Paris Fashion Shop et à Ankorstore.</p>
          <p style="margin-top:12px; font-size:13px;">Les traductions (anglais, allemand, etc.) sont en cours de mise à jour en arrière-plan, comptez quelques minutes.</p>
        </div>
      ` : `
        <div class="recap-header">
          <h1>Récapitulatif du lot</h1>
          <div class="recap-stat">${validatedCount} <span style="font-size:18px; color:#78716c; font-weight:400;">/ ${products.length}</span></div>
          <p>produit(s) prêts à être envoyés. Vérifiez et cliquez sur « Tout pousser » quand vous êtes prête.</p>
        </div>
      `;

      const actionsHtml = isPushed ? `
        <div class="recap-actions">
          <p style="text-align:center; font-size:13px; color:#57534e;">
            Vous pouvez fermer cette page. Pour démarrer un nouveau lot, retournez dans Claude Code et tapez <code style="background:#f5f5f4; padding:2px 6px; border-radius:4px;">/produits-nom</code>.
          </p>
        </div>
      ` : `
        <div class="recap-actions">
          <button class="btn btn-back" onclick="backToEdit()">← Revoir les produits un par un</button>
          <button class="btn btn-big-push" onclick="pushFromRecap()" ${validatedCount === 0 ? 'disabled' : ''}>
            Tout pousser sur le site (${validatedCount})
          </button>
        </div>
      `;

      document.getElementById('main').innerHTML = headerHtml + '<div class="recap-list">' + rowsHtml + '</div>' + actionsHtml;
    }

    function editFromRecap(idx) {
      currentIdx = idx;
      viewMode = 'edit';
      selectedName = null;
      selectedDesc = null;
      nameComment = '';
      descComment = '';
      render();
    }

    function backToEdit() {
      viewMode = 'edit';
      currentIdx = findFirstUnvalidatedIdx();
      render();
    }

    async function pushFromRecap() {
      document.getElementById('push-btn').click();
    }

    // ============ HINTS VIEW (étape 1 : la cliente décrit chaque produit) ============
    const hintSaveTimers = new Map(); // ref -> setTimeout id (autosave debounced)
    let hintsViewRendered = false; // évite d'écraser les <textarea> en cours de saisie

    function countHintsFilled() {
      const hints = (session && session.hints) || {};
      let n = 0;
      for (const k in hints) {
        if (typeof hints[k] === 'string' && hints[k].trim().length > 0) n++;
      }
      return n;
    }

    function updateHintsTopbar() {
      const total = (session.products || []).length;
      const filled = countHintsFilled();
      document.getElementById('progress-text').textContent =
        'Étape 1 · Indices — ' + filled + ' sur ' + total + ' produit(s) décrit(s)';
      document.getElementById('progress-fill').style.width =
        total > 0 ? ((filled / total) * 100) + '%' : '0%';
    }

    function renderHintsView() {
      const products = session.products || [];
      const totalCount = products.length;
      updateHintsTopbar();
      const pushBtn = document.getElementById('push-btn');
      pushBtn.style.display = 'none';

      // Ne re-render que si c'est la 1re fois (sinon on écraserait la saisie en cours).
      // refresh() polling met à jour session.hints en mémoire mais pas le DOM des textareas.
      if (hintsViewRendered) return;
      hintsViewRendered = true;

      const hints = session.hints || {};
      const cardsHtml = products.map((p) => {
        const imgSrc = '/images/' + p.reference.toLowerCase() + '.webp';
        const catName = p.category ? (typeof p.category === 'string' ? p.category : p.category.name) : '';
        const oldName = p.name || '';
        const currentHint = hints[p.reference] || '';
        const filledClass = currentHint.trim() ? ' filled' : '';
        return (
          '<div class="hint-card' + filledClass + '" data-ref="' + escapeAttr(p.reference) + '">' +
            '<img class="hint-card-image" src="' + imgSrc + '" alt="' + escapeAttr(p.reference) + '" onclick="openLightbox(\'' + imgSrc + '\')" onerror="this.style.display=\'none\'">' +
            '<div class="hint-card-body">' +
              '<div class="hint-card-header">' +
                '<span class="hint-card-ref">' + escapeHtml(p.reference) + '</span>' +
                (catName ? '<span class="hint-card-cat">' + escapeHtml(catName) + '</span>' : '') +
              '</div>' +
              (oldName ? '<div class="hint-card-oldname" title="' + escapeAttr(oldName) + '">' + escapeHtml(oldName) + '</div>' : '') +
              '<textarea class="hint-textarea" placeholder="Vos indices (facultatif) — matière, forme, motif, mots-clés…" data-ref="' + escapeAttr(p.reference) + '">' + escapeHtml(currentHint) + '</textarea>' +
              '<div class="hint-status" data-ref="' + escapeAttr(p.reference) + '"></div>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      document.getElementById('main').innerHTML =
        '<div class="hints-intro">' +
          '<h1>Étape 1 · Décrivez chaque produit rapidement</h1>' +
          '<p>Pour chaque produit, écrivez quelques mots — matière, forme, motif principal, tout ce qui pourrait m\'aider à ne pas me tromper. <strong>Vous pouvez laisser vide</strong> si vous n\'avez rien à ajouter (je générerai à froid pour ce produit).</p>' +
          '<span class="hint-example">Exemple : « acier, forme cœur, petits strass, chaîne fine »</span>' +
        '</div>' +
        '<div class="hints-grid">' + cardsHtml + '</div>' +
        '<div class="hints-cta">' +
          '<button id="btn-generate-props" class="btn-generate">Générer les propositions (' + totalCount + ' produits)</button>' +
        '</div>';

      // Wire up autosave sur toutes les textareas (debounce 500ms)
      document.querySelectorAll('.hint-textarea').forEach((ta) => {
        ta.addEventListener('input', function () {
          const ref = ta.dataset.ref;
          const value = ta.value;
          const card = ta.closest('.hint-card');
          if (card) card.classList.toggle('filled', value.trim().length > 0);
          const status = document.querySelector('.hint-status[data-ref="' + ref + '"]');
          if (status) { status.textContent = '…'; status.className = 'hint-status'; }
          if (hintSaveTimers.has(ref)) clearTimeout(hintSaveTimers.get(ref));
          hintSaveTimers.set(ref, setTimeout(async function () {
            const ok = await postJSON('/api/save-hint', { ref, hint: value });
            const st = document.querySelector('.hint-status[data-ref="' + ref + '"]');
            if (st) {
              st.textContent = ok ? '✓ enregistré' : '⚠ erreur — retapez';
              st.className = 'hint-status ' + (ok ? 'saved' : 'error');
              if (ok) setTimeout(function () {
                if (st.textContent === '✓ enregistré') st.textContent = '';
              }, 1500);
            }
            // Sync local session.hints + compteur en haut
            if (!session.hints) session.hints = {};
            session.hints[ref] = value;
            updateHintsTopbar();
          }, 500));
        });
      });

      // Wire up bouton « Générer les propositions »
      document.getElementById('btn-generate-props').addEventListener('click', async function () {
        const btn = this;
        btn.disabled = true;
        btn.textContent = 'Envoi en cours…';
        // Flush tout autosave en cours pour être sûr que tout est bien sauvé côté serveur
        for (const [ref, t] of hintSaveTimers.entries()) {
          clearTimeout(t);
          const ta = document.querySelector('.hint-textarea[data-ref="' + ref + '"]');
          if (ta) await postJSON('/api/save-hint', { ref, hint: ta.value });
        }
        hintSaveTimers.clear();
        const ok = await postJSON('/api/request-generation', {});
        if (!ok) {
          toast('Erreur — réessayez');
          btn.disabled = false;
          btn.textContent = 'Générer les propositions (' + (session.products || []).length + ' produits)';
          return;
        }
        session.phase = 'awaiting_generation';
        hintsViewRendered = false;
        render();
      });
    }

    function renderAwaitingGenerationView() {
      document.getElementById('progress-text').textContent = 'Étape 2 · Analyse en cours…';
      document.getElementById('progress-fill').style.width = '100%';
      const pushBtn = document.getElementById('push-btn');
      pushBtn.style.display = 'none';
      hintsViewRendered = false;

      document.getElementById('main').innerHTML =
        '<div class="await-gen-view">' +
          '<h1><span class="pulse"></span>J\'analyse les produits…</h1>' +
          '<p>Vos indices sont bien enregistrés. Il reste une seule action à faire :</p>' +
          '<p><strong>Retournez dans Claude Code et tapez :</strong></p>' +
          '<div class="cmd-hint">génère</div>' +
          '<p style="margin-top:24px; font-size:13px; color:#78716c;">' +
            'Je regarderai chaque photo en tenant compte de vos indices, puis proposerai 3 noms et 3 descriptions par produit.<br>' +
            'Cette page se mettra à jour automatiquement quand ce sera prêt (comptez 1 à 3 minutes selon la taille du lot).' +
          '</p>' +
        '</div>';
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/\n/g, ' ');
    }

    function capitalize(s) {
      const v = String(s || '').trim();
      if (!v) return v;
      return v.charAt(0).toLocaleUpperCase('fr-FR') + v.slice(1).toLocaleLowerCase('fr-FR');
    }

    function chipHtml(label, checked) {
      const base = 'display:inline-flex;align-items:center;padding:4px 12px;border-radius:9999px;border:1px solid;font-size:13px;cursor:pointer;transition:all .15s;';
      const active = 'background:#10b981;color:white;border-color:#10b981;';
      const inactive = 'background:white;color:#44403c;border-color:#d6d3d1;';
      return '<button type="button" style="' + base + (checked ? active : inactive) + '">' + escapeHtml(label) + '</button>';
    }

    function renderSubcats() {
      const list = document.getElementById('subcats-list');
      if (!list) return;
      list.innerHTML = '';
      for (const [key, item] of subcats) {
        const wrap = document.createElement('div');
        wrap.innerHTML = chipHtml(item.name, item.checked);
        const btn = wrap.firstElementChild;
        btn.addEventListener('click', function () {
          item.checked = !item.checked;
          renderSubcats();
        });
        list.appendChild(btn);
      }
    }

    function renderComposition() {
      const list = document.getElementById('composition-list');
      if (!list) return;
      list.innerHTML = '';
      for (const [ref, item] of composition) {
        const row = document.createElement('label');
        row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #e7e5e4;border-radius:8px;background:' + (item.checked ? '#f0fdf4' : '#fafaf9') + ';cursor:pointer;font-size:14px;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!item.checked;
        cb.style.cssText = 'width:16px;height:16px;cursor:pointer;';
        const refEl = document.createElement('strong');
        refEl.style.cssText = 'font-family:monospace;color:#1c1917;';
        refEl.textContent = item.ref;
        const sep = document.createElement('span');
        sep.style.color = '#78716c';
        sep.textContent = '·';
        const catEl = document.createElement('span');
        catEl.style.color = '#57534e';
        catEl.textContent = item.category;
        row.appendChild(cb);
        row.appendChild(refEl);
        row.appendChild(sep);
        row.appendChild(catEl);
        cb.addEventListener('change', function () {
          item.checked = cb.checked;
          renderComposition();
        });
        list.appendChild(row);
      }
    }

    function renderTags() {
      const list = document.getElementById('tags-list');
      if (!list) return;
      list.innerHTML = '';
      for (const [key, item] of tags) {
        const wrap = document.createElement('div');
        wrap.innerHTML = chipHtml(item.name, item.checked);
        const btn = wrap.firstElementChild;
        btn.addEventListener('click', function () {
          item.checked = !item.checked;
          renderTags();
        });
        list.appendChild(btn);
      }
    }

    function setupAutocomplete(inputId, ulId, btnId, urlBuilder, onPick) {
      const input = document.getElementById(inputId);
      const ul = document.getElementById(ulId);
      const btn = document.getElementById(btnId);
      if (!input || !ul || !btn) return;
      let timer = null;
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          btn.click();
        }
      });
      input.addEventListener('input', function () {
        clearTimeout(timer);
        const q = input.value.trim();
        if (!q) { ul.style.display = 'none'; return; }
        timer = setTimeout(async function () {
          const r = await fetch(urlBuilder() + encodeURIComponent(q)).then(r => r.json());
          ul.innerHTML = '';
          for (const item of r.results) {
            const li = document.createElement('li');
            li.style.cssText = 'cursor:pointer;padding:8px 12px;font-size:13px;list-style:none;';
            li.textContent = item.name;
            li.addEventListener('mouseenter', function () { li.style.background = '#f5f5f4'; });
            li.addEventListener('mouseleave', function () { li.style.background = ''; });
            li.addEventListener('click', function () {
              onPick(item);
              input.value = '';
              ul.style.display = 'none';
            });
            ul.appendChild(li);
          }
          ul.style.display = r.results.length === 0 ? 'none' : 'block';
        }, 150);
      });
      document.addEventListener('click', function (e) {
        if (!input.contains(e.target) && !ul.contains(e.target)) ul.style.display = 'none';
      });
      btn.addEventListener('click', function () {
        const v = input.value.trim();
        if (!v) return;
        onPick({ id: 'new::' + v, name: v });
        input.value = '';
        ul.style.display = 'none';
      });
    }

    function initSubcatTagsForProduct(p) {
      // Si on rerend le même produit, garder l'état en cours (cases décochées, ajouts, etc.).
      if (currentProduct && currentProduct.reference === p.reference) {
        currentProduct = p;
        return;
      }
      subcats = new Map();
      tags = new Map();
      composition = new Map();
      currentProduct = p;

      for (const sc of (p.subCategories || [])) {
        subcats.set(sc.id, { id: sc.id, name: capitalize(sc.name), checked: true });
      }
      for (const sc of (p.proposedSubCategories || [])) {
        const key = sc.id || ('new::' + sc.name);
        if (!subcats.has(key)) {
          subcats.set(key, { id: sc.id || null, name: capitalize(sc.name), checked: true });
        }
      }
      for (const t of (p.tags || [])) {
        tags.set(t.id, { id: t.id, name: capitalize(t.name), checked: true });
      }
      for (const t of (p.proposedTags || [])) {
        const key = t.id || ('new::' + t.name);
        if (!tags.has(key)) {
          tags.set(key, { id: t.id || null, name: capitalize(t.name), checked: true });
        }
      }
      for (const sib of (p.siblings || [])) {
        composition.set(sib.ref, {
          ref: sib.ref,
          category: sib.category || '',
          checked: true,
        });
      }
    }

    function setupSubcatTagListeners() {
      setupAutocomplete(
        'subcat-add-input',
        'subcat-suggestions',
        'subcat-add-btn',
        function () {
          const catId = (currentProduct && currentProduct.categoryId) ? currentProduct.categoryId : '';
          return '/api/autocomplete/subcats?categoryId=' + encodeURIComponent(catId) + '&q=';
        },
        function (item) {
          const name = capitalize(item.name);
          const key = item.id || ('new::' + name);
          subcats.set(key, { id: item.id && !item.id.startsWith('new::') ? item.id : null, name, checked: true });
          renderSubcats();
        }
      );
      setupAutocomplete(
        'tag-add-input',
        'tag-suggestions',
        'tag-add-btn',
        function () { return '/api/autocomplete/tags?q='; },
        function (item) {
          const name = capitalize(item.name);
          const key = item.id || ('new::' + name);
          tags.set(key, { id: item.id && !item.id.startsWith('new::') ? item.id : null, name, checked: true });
          renderTags();
        }
      );

      const regenBtn = document.getElementById('clarif-regen-btn');
      if (regenBtn) {
        regenBtn.addEventListener('click', async function () {
          const p = currentProduct;
          if (!p) return;
          const answers = Array.from(document.querySelectorAll('.clarif-answer'))
            .map(i => ({ question: decodeURIComponent(i.dataset.question), answer: i.value.trim() }))
            .filter(a => a.answer);
          if (answers.length === 0) { alert('Répondez à au moins une question d\'abord.'); return; }
          await fetch('/api/request-regen', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ref: p.reference,
              comment: answers.map(a => a.question + ' → ' + a.answer).join('\n'),
              what: 'all',
              answers,
            }),
          });
          alert('Demande envoyée. Revenez dans Claude Code et tapez « regénère ».');
        });
      }
    }

    function onSelectName(v) { selectedName = v; render(); }
    function onSelectDesc(v) { selectedDesc = v; render(); }

    async function validate() {
      if (!selectedName || !selectedDesc || selectedName === '__NONE__' || selectedDesc === '__NONE__') return;
      const p = session.products[currentIdx];
      const tagNames = Array.from(tags.values()).filter(t => t.checked).map(t => t.name);
      const subCategoryNames = Array.from(subcats.values()).filter(sc => sc.checked).map(sc => sc.name);
      const compositionRefs = Array.from(composition.values()).filter(c => c.checked).map(c => c.ref);
      const ok = await postJSON('/api/validate', {
        ref: p.reference,
        name: selectedName,
        description: selectedDesc,
        tagNames,
        subCategoryNames,
        compositionRefs,
      });
      if (!ok) { toast('Erreur de sauvegarde'); return; }
      session.decisions = session.decisions || {};
      session.decisions[p.reference] = { name: selectedName, description: selectedDesc, validated_at: new Date().toISOString() };
      showSaved();
      // Reset selections and go next
      selectedName = null;
      selectedDesc = null;
      nameComment = '';
      descComment = '';
      if (currentIdx < session.products.length - 1) {
        currentIdx++;
      } else {
        toast('Vous avez fini ce lot !');
      }
      render();
    }

    async function requestRegen() {
      const p = session.products[currentIdx];
      const what =
        (selectedName === '__NONE__' && selectedDesc === '__NONE__') ? 'both'
        : selectedName === '__NONE__' ? 'name'
        : 'description';
      const comment = what === 'name' ? nameComment
        : what === 'description' ? descComment
        : `NOMS: ${nameComment} | DESCRIPTIONS: ${descComment}`;
      if (!comment.trim()) { toast('Écrivez d\'abord pourquoi rien ne va'); return; }
      const ok = await postJSON('/api/request-regen', { ref: p.reference, comment, what });
      if (!ok) { toast('Erreur'); return; }
      session.awaitingRegen = { ref: p.reference, comment, what, at: new Date().toISOString() };
      render();
    }

    function goPrev() {
      if (currentIdx > 0) {
        currentIdx--;
        selectedName = null;
        selectedDesc = null;
        nameComment = '';
        descComment = '';
        render();
      }
    }
    function goNext() {
      if (currentIdx < session.products.length - 1) {
        currentIdx++;
        selectedName = null;
        selectedDesc = null;
        nameComment = '';
        descComment = '';
        render();
      }
    }
    function skip() { goNext(); }

    async function keepAsIs() {
      const p = session && session.products ? session.products[currentIdx] : null;
      if (!p) return;
      // Envoie le nom et la description actuels (déjà en BDD), + tags/sous-cat existants s'il y en a.
      // Le script apply prépend juste la note "Complété par l'IA le DD/MM/YYYY".
      const name = (p.name || '').trim();
      const description = (p.description || '').trim();
      if (!name || !description) {
        toast('Impossible : ce produit n\'a pas de nom ou de description en base.');
        return;
      }
      const tagNames = (p.tags || []).map(t => t.name);
      const subCategoryNames = (p.subCategories || []).map(sc => sc.name);
      const compositionRefs = (p.siblings || []).map(s => s.ref); // par défaut : tout coché
      const ok = await postJSON('/api/validate', {
        ref: p.reference, name, description, tagNames, subCategoryNames, compositionRefs,
      });
      if (!ok) { toast('Erreur lors de la sauvegarde'); return; }
      toast('Marqué comme « pas besoin de modifier »');
      session.decisions = session.decisions || {};
      session.decisions[p.reference] = { name, description, validated_at: new Date().toISOString() };
      selectedName = null;
      selectedDesc = null;
      nameComment = '';
      descComment = '';
      if (currentIdx < session.products.length - 1) goNext();
      else render();
    }

    function openLightbox(src) {
      const box = document.getElementById('img-lightbox');
      const img = document.getElementById('img-lightbox-img');
      if (!box || !img) return;
      img.src = src;
      box.classList.add('open');
    }
    function closeLightbox() {
      const box = document.getElementById('img-lightbox');
      if (box) box.classList.remove('open');
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    document.getElementById('push-btn').addEventListener('click', async () => {
      if (!confirm('Pousser tous les produits validés sur le vrai site ?\n\nÇa va mettre à jour la boutique + PFS + Ankorstore.\nVous pouvez fermer la page après, l\'envoi continuera tout seul.')) return;
      const r = await fetch('/api/push-all', { method: 'POST' });
      if (r.ok) {
        toast('Envoi lancé ! Vous pouvez fermer la page.');
        const data = await r.json();
        if (data.count !== undefined) toast(`${data.count} produit(s) en cours d'envoi`);
        setTimeout(refresh, 500);
      } else {
        toast('Erreur lors de l\'envoi');
      }
    });

    async function refresh() {
      const s = await fetchSession();
      if (!s) return;
      const prevAwaiting = session?.awaitingRegen?.ref;
      const newAwaiting = s.awaitingRegen?.ref;
      const prevStatus = session?.status;
      const prevPhase = session?.phase || 'validating';
      const newPhase = s.phase || 'validating';
      const wasResolved = prevAwaiting && !newAwaiting;
      const startedAwaiting = !prevAwaiting && newAwaiting;
      const statusChanged = prevStatus !== s.status;
      const phaseChanged = prevPhase !== newPhase;
      session = s;
      // Ne re-rendre QUE si un changement pertinent est arrivé.
      // Sinon on écraserait la saisie en cours (chips décochés, focus textarea, indices en cours).
      if (wasResolved) {
        selectedName = null;
        selectedDesc = null;
        nameComment = '';
        descComment = '';
        toast('Nouvelles propositions chargées !');
        render();
      } else if (phaseChanged) {
        // Reset flag "hints view déjà rendue" pour permettre un re-render propre à chaque bascule
        hintsViewRendered = false;
        if (newPhase === 'validating') {
          currentIdx = findFirstUnvalidatedIdx();
          selectedName = null;
          selectedDesc = null;
          toast('Propositions prêtes ! Choisissez pour chaque produit.');
        }
        render();
      } else if (startedAwaiting || statusChanged) {
        render();
      }
    }

    (async () => {
      session = await fetchSession();
      if (session && session.products && session.products.length > 0) {
        currentIdx = findFirstUnvalidatedIdx();
      }
      render();
      setInterval(refresh, 2500);
    })();
  </script>
</body>
